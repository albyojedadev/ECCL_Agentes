name: Integridad y regresiones ECCL
on: [push, pull_request]
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B scripts/verify_installation.py
      - run: python -B evals/run_evals.py
